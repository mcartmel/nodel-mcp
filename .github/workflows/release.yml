name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout protected tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes shellcheck
      - name: Verify tag and package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run release-version-check
      - name: Install dependencies
        run: npm ci
      - name: Fetch and verify Caddy v2.11.3 validator
        run: node scripts/fetch-caddy-validation.mjs --output "$RUNNER_TEMP/caddy"
        env:
          CADDY_REQUIRED: "true"
      - name: Require exact-commit compatibility success
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: npm run release:compatibility-check
      - name: Run release gates
        run: npm run release:check
      - name: Build exact release archive
        run: SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" npm run release:package
      - name: Verify release evidence determinism
        run: SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" npm run release:determinism
      - name: Smoke exact release archive
        run: npm run release:smoke
      - name: Attest release evidence
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.2.2
        with:
          subject-path: |
            artifacts/nodel-ai-v*.tar.gz
            artifacts/SBOM.cdx.json
            artifacts/dependency-licenses.json
            artifacts/ARTIFACT-MANIFEST.json
            artifacts/SHA256SUMS
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" artifacts/nodel-ai-v*.tar.gz artifacts/SHA256SUMS artifacts/SBOM.cdx.json artifacts/dependency-licenses.json artifacts/ARTIFACT-MANIFEST.json --draft --title "nodel-ai ${{ github.ref_name }}" --notes-file CHANGELOG.md
